<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Media Test</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
            width: 100vw;
            height: 100vh;
        }
        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        canvas, video, img {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <script src="webviewScript.js"></script>
</body>
</html>
